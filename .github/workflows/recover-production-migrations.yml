name: Finalize Production Migration History

on:
  push:
    branches:
      - agent/artistos-migration-reconciliation
    paths:
      - .github/workflows/recover-production-migrations.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-production-migrations
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/artistos-migration-reconciliation
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Normalize recovered migration bytes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          document = json.loads(Path('supabase/REMOTE_MIGRATION_MANIFEST.json').read_text())
          manifest = document['migrations']
          migrations_dir = Path('supabase/migrations')
          changed = 0

          for row in manifest:
              path = migrations_dir / f"{row['version']}_{row['name']}.sql"
              data = path.read_bytes()
              if data.endswith(b'\n'):
                  data = data[:-1]
              path.write_bytes(data)

          foundation = migrations_dir / '20260711232934_artistos_core_foundation.sql'
          text = foundation.read_text()
          text = text.replace('-- ============= WORKSPACE / IDENTITY =============', '-- ============ WORKSPACE / IDENTITY ============')
          text = text.replace('-- ============= IMPORT / PROVENANCE (rollback backbone) =============', '-- ============ IMPORT / PROVENANCE (rollback backbone) ============')
          text = text.replace('-- ============= INDUSTRY GRAPH =============', '-- ============ INDUSTRY GRAPH ============')
          text = text.replace('-- ============= CAMPAIGN / EXECUTION =============', '-- ============ CAMPAIGN / EXECUTION ============')
          text = text.replace('-- ============= FAN CRM (strictly separate) =============', '-- ============ FAN CRM (strictly separate) ============')
          foundation.write_text(text)

          tenancy = migrations_dir / '20260726184029_workspace_tenancy_phase_a_additive.sql'
          tenancy.write_text(tenancy.read_text().replace('workspace tenanty', 'workspace tenancy'))

          print('Normalized 28 historical migrations and corrected the two identified byte discrepancies.')
          PY

      - name: Verify exact manifest bytes
        run: node scripts/check-remote-migration-manifest.mjs supabase/REMOTE_MIGRATION_MANIFEST.json

      - name: Commit exact recovered history
        run: |
          git config user.name "artistos-migration-recovery[bot]"
          git config user.email "artistos-migration-recovery[bot]@users.noreply.github.com"
          git add supabase/migrations
          if git diff --cached --quiet; then
            echo 'Historical migrations are already byte-exact.'
            exit 0
          fi
          git commit -m "Finalize exact production migration history"
          git push origin HEAD:agent/artistos-migration-reconciliation
