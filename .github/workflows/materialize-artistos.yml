name: Materialize ArtistOS source

on:
  push:
    branches: [claude-major-rebuild]
    paths:
      - '.github/workflows/materialize-artistos.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude-major-rebuild
          fetch-depth: 0
      - name: Expand validated source
        shell: bash
        run: |
          set -euo pipefail
          cat .artistos-source.part* | base64 --decode > /tmp/artistos-source.tar.gz
          tar -xzf /tmp/artistos-source.tar.gz -C .
          rm -f .artistos-source.part* .github/workflows/materialize-artistos.yml
          git config user.name "artistos-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Complete ArtistOS major rebuild"
          git push origin HEAD:claude-major-rebuild
