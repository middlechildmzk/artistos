name: Validate and Deploy ArtistOS Preview

on:
  push:
    branches:
      - claude-major-rebuild
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artistos-preview
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_tURNGn8d3ljgUAExWDM2Jjed
  VERCEL_PROJECT_ID: prj_p4H6ECpMwioHVPXNmQjRltbB0PUe

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out readable ArtistOS source
        uses: actions/checkout@v4
        with:
          ref: claude-major-rebuild

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate application
        run: npm run check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Require Vercel deployment credential
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "Missing repository secret VERCEL_TOKEN. Add a Vercel token with access to the ArtistOS project."
            exit 1
          fi

      - name: Pull Vercel preview configuration
        run: npx vercel@latest pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build with Vercel preview environment
        run: npx vercel@latest build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy preview
        run: npx vercel@latest deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
