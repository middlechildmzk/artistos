name: ArtistOS Database Replay

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - artifacts/**
      - docs/**
      - '**/*.md'
  push:
    branches: [main]
    paths-ignore:
      - artifacts/**
      - docs/**
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artistos-release-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact triggering release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind release source and clear stale runtime evidence
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "$checked_out_sha" != "$EXPECTED_SHA" ]]; then
            echo "Checked out ${checked_out_sha}, expected triggering source ${EXPECTED_SHA}." >&2
            exit 1
          fi
          echo "RELEASE_SOURCE_SHA=${checked_out_sha}" >> "$GITHUB_ENV"
          rm -f artifacts/authenticated-e2e/summary.json artifacts/authenticated-e2e/*.png
          rm -f artifacts/release-readiness/report.json artifacts/release-readiness/report.md artifacts/release-readiness/events.ndjson

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.84.2
          github-token: ${{ github.token }}

      - name: Verify historical drift, full replay, RLS, and advisors
        id: replay
        shell: bash
        env:
          KEEP_SUPABASE_RUNNING: "1"
        run: |
          set +e
          bash scripts/verify-local-supabase.sh 2>&1 | tee database-replay.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write source-bound replay evidence
        shell: bash
        run: |
          mkdir -p artifacts/release-readiness
          if [[ "${{ steps.replay.outputs.status }}" == "0" ]]; then
            result="PASS"
            rls_checked=true
          else
            result="FAIL"
            rls_checked=false
          fi
          if [[ -f artifacts/schema-drift/summary.json ]]; then
            drift_checked=true
          else
            drift_checked=false
          fi
          cat > artifacts/release-readiness/local-db-replay.json <<EOF
          {
            "schema_version": 1,
            "result": "${result}",
            "source_commit": "${RELEASE_SOURCE_SHA}",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "supabase_cli_version": "2.84.2",
            "historical_schema_drift_checked": ${drift_checked},
            "workspace_rls_checked": ${rls_checked},
            "production_mutated": false,
            "completed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Export disposable application environment
        if: steps.replay.outputs.status == '0'
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          {
            echo "SUPABASE_URL=${API_URL}"
            echo "SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "ARTISTOS_APP_URL=http://127.0.0.1:3000"
          } >> "$GITHUB_ENV"

      - name: Install application and browser
        if: steps.replay.outputs.status == '0'
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Build and start exact release source
        if: steps.replay.outputs.status == '0'
        shell: bash
        run: |
          npm run build
          nohup npm run start -- -H 127.0.0.1 -p 3000 > artistos-e2e-app.log 2>&1 &
          echo $! > /tmp/artistos-e2e-app.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/login >/dev/null; then
              echo "ArtistOS is ready."
              exit 0
            fi
            sleep 1
          done
          cat artistos-e2e-app.log
          exit 1

      - name: Run authenticated browser journeys
        if: steps.replay.outputs.status == '0'
        id: e2e
        shell: bash
        run: |
          set +e
          GITHUB_SHA="$RELEASE_SOURCE_SHA" node scripts/run-authenticated-e2e.mjs 2>&1 | tee authenticated-e2e.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Generate source-bound readiness report
        if: always() && !cancelled() && steps.replay.outputs.status == '0' && hashFiles('artifacts/authenticated-e2e/summary.json') != ''
        shell: bash
        run: |
          set +e
          RELEASE_GIT_SHA="$RELEASE_SOURCE_SHA" node scripts/generate-release-readiness-report.mjs 2>&1 | tee readiness-report.log
          exit 0

      - name: Validate preapproval evidence contracts
        if: always() && !cancelled() && steps.replay.outputs.status == '0' && hashFiles('artifacts/authenticated-e2e/summary.json') != ''
        id: contracts
        shell: bash
        run: |
          set +e
          RELEASE_EVIDENCE_STAGE=preapproval RELEASE_GIT_SHA="$RELEASE_SOURCE_SHA" node scripts/validate-release-evidence.mjs 2>&1 | tee evidence-validation.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload release verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artistos-release-verification-${{ github.run_id }}
          path: |
            database-replay.log
            authenticated-e2e.log
            artistos-e2e-app.log
            readiness-report.log
            evidence-validation.log
            artifacts/release-readiness/local-db-replay.json
            artifacts/release-readiness/report.json
            artifacts/release-readiness/report.md
            artifacts/release-readiness/events.ndjson
            artifacts/authenticated-e2e/summary.json
            artifacts/authenticated-e2e/*.png
            artifacts/schema-drift/local-historical-fingerprint.json
            artifacts/schema-drift/local-historical-inventory.json
            artifacts/schema-drift/summary.json
            artifacts/schema-drift/summary.txt

      - name: Enforce durable verification evidence
        if: always() && !cancelled()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const read = (file) => JSON.parse(fs.readFileSync(file, 'utf8'));
          const replay = read('artifacts/release-readiness/local-db-replay.json');
          const e2e = read('artifacts/authenticated-e2e/summary.json');
          const readiness = read('artifacts/release-readiness/report.json');
          if (replay.result !== 'PASS') throw new Error(`Database replay evidence is ${replay.result}`);
          if (replay.source_commit !== process.env.RELEASE_SOURCE_SHA) throw new Error('Database replay evidence is bound to a different commit');
          if (e2e.status !== 'PASS') throw new Error(`Authenticated E2E evidence is ${e2e.status}: ${e2e.summary}`);
          if (e2e.source_commit !== process.env.RELEASE_SOURCE_SHA) throw new Error('Authenticated E2E evidence is bound to a different commit');
          if (readiness.overall !== 'GO') throw new Error(`Release readiness is ${readiness.overall}`);
          if (readiness.git_sha !== process.env.RELEASE_SOURCE_SHA) throw new Error('Readiness evidence is bound to a different commit');
          console.log('Durable replay, authenticated E2E, and readiness evidence are PASS and source-bound.');
          NODE
          test "${{ steps.contracts.outputs.status }}" = "0"

      - name: Clean up local services
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/artistos-e2e-app.pid ]]; then
            kill "$(cat /tmp/artistos-e2e-app.pid)" >/dev/null 2>&1 || true
          fi
          supabase stop --no-backup >/dev/null 2>&1 || true
