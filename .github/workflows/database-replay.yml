name: ArtistOS Database Replay

on:
  push:
    branches:
      - agent/artistos-canonical-integration
    paths:
      - .github/workflows/database-replay.yml
      - supabase/**
      - tests/rls/**
      - scripts/verify-local-supabase.sh
      - scripts/application-schema-fingerprint.sql
      - scripts/application-schema-inventory.sql
      - scripts/compare-schema-fingerprints.mjs
      - artifacts/schema-drift/production-fingerprint.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: artistos-database-replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/artistos-canonical-integration
          fetch-depth: 0
          persist-credentials: true

      - name: Bind replay to release source
        shell: bash
        run: echo "RELEASE_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.84.2
          github-token: ${{ github.token }}

      - name: Verify historical drift, full replay, RLS, and advisors
        id: replay
        shell: bash
        run: |
          set +e
          bash scripts/verify-local-supabase.sh 2>&1 | tee database-replay.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write replay evidence
        shell: bash
        run: |
          mkdir -p artifacts/release-readiness
          if [[ "${{ steps.replay.outputs.status }}" == "0" ]]; then
            result="PASS"
            rls_checked=true
          else
            result="FAIL"
            rls_checked=false
          fi
          if [[ -f artifacts/schema-drift/summary.json ]]; then
            drift_checked=true
          else
            drift_checked=false
          fi
          cat > artifacts/release-readiness/local-db-replay.json <<EOF
          {
            "schema_version": 1,
            "result": "${result}",
            "source_commit": "${RELEASE_SOURCE_SHA}",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "supabase_cli_version": "2.84.2",
            "historical_schema_drift_checked": ${drift_checked},
            "workspace_rls_checked": ${rls_checked},
            "production_mutated": false,
            "completed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Upload replay diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artistos-database-replay-${{ github.run_id }}
          path: |
            database-replay.log
            artifacts/release-readiness/local-db-replay.json
            artifacts/schema-drift/local-historical-fingerprint.json
            artifacts/schema-drift/local-historical-inventory.json
            artifacts/schema-drift/summary.json
            artifacts/schema-drift/summary.txt

      - name: Commit verification evidence
        shell: bash
        run: |
          rm -rf /tmp/artistos-db-evidence
          mkdir -p /tmp/artistos-db-evidence/artifacts/release-readiness /tmp/artistos-db-evidence/artifacts/schema-drift
          cp artifacts/release-readiness/local-db-replay.json /tmp/artistos-db-evidence/artifacts/release-readiness/
          for evidence in local-historical-fingerprint.json local-historical-inventory.json summary.json summary.txt; do
            if [[ -f "artifacts/schema-drift/${evidence}" ]]; then
              cp "artifacts/schema-drift/${evidence}" "/tmp/artistos-db-evidence/artifacts/schema-drift/${evidence}"
            fi
          done

          git config user.name "artistos-database-replay[bot]"
          git config user.email "artistos-database-replay[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin agent/artistos-canonical-integration
            git reset --hard origin/agent/artistos-canonical-integration
            cp -a /tmp/artistos-db-evidence/. .
            git add artifacts/release-readiness/local-db-replay.json artifacts/schema-drift

            if git diff --cached --quiet; then
              echo "Database verification evidence is unchanged."
              exit 0
            fi

            git commit -m "Record isolated database verification result"
            if git push origin HEAD:agent/artistos-canonical-integration; then
              exit 0
            fi
            echo "Branch advanced during evidence publication; retrying (${attempt}/3)."
          done

          echo "Could not publish database verification evidence after three fast-forward attempts." >&2
          exit 1

      - name: Enforce replay result
        shell: bash
        run: |
          if [[ "${{ steps.replay.outputs.status }}" != "0" ]]; then
            echo "Isolated database verification failed. See the uploaded diagnostics and committed evidence." >&2
            exit 1
          fi
