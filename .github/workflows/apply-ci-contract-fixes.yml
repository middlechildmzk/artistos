name: Apply ArtistOS CI Contract Fixes

on:
  push:
    branches:
      - agent/artistos-migration-reconciliation
    paths:
      - .github/workflows/apply-ci-contract-fixes.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-artistos-ci-contract-fixes
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/artistos-migration-reconciliation
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply reviewed fix bundle
        run: |
          cat > /tmp/artistos-ci-fix.b64 <<'BUNDLE'

BUNDLE
          base64 -d /tmp/artistos-ci-fix.b64 > /tmp/artistos-ci-fix.tgz
          tar -xzf /tmp/artistos-ci-fix.tgz -C .
          rm -f .github/workflows/apply-ci-contract-fixes.yml

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run architecture tests
        run: npm test

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Build production application
        run: npm run build

      - name: Commit validated fixes
        run: |
          git config user.name "artistos-ci-fix[bot]"
          git config user.email "artistos-ci-fix[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Route execution and operating writes through capability runtime"
          git push origin HEAD:agent/artistos-migration-reconciliation
