name: Apply release-fit transfer

on:
  push:
    branches:
      - agent/release-fit-sourcing-v1

permissions:
  contents: write

jobs:
  apply-transfer:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and apply reviewed transfer
        shell: bash
        run: |
          set -euo pipefail
          transfer_dir=.artistos-transfer/release-fit
          archive=/tmp/release-fit-corrected-files.tgz
          cat "$transfer_dir"/[0-9][0-9] | base64 --decode > "$archive"
          echo "78da05b58fc0ac5fb049a6d93a1428044c937a41b41d883bddb7d91fb2c759f5  $archive" | sha256sum --check --strict

          mapfile -t paths < <(tar -tzf "$archive")
          test "${#paths[@]}" -eq 14
          for path in "${paths[@]}"; do
            case "$path" in
              /*|../*|*/../*|*/..) echo "Unsafe archive path: $path" >&2; exit 1 ;;
            esac
          done

          tar -xzf "$archive" -C .
          rm -rf .artistos-transfer/release-fit
          rm .github/workflows/apply-release-fit-transfer.yml

          git config user.name "artistos-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Build release-fit sourcing workspace"
          git push origin HEAD:agent/release-fit-sourcing-v1
