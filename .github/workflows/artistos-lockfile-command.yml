name: ArtistOS lockfile command

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: read

jobs:
  generate:
    if: >
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/generate-artistos-lockfile')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude-major-rebuild
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate lockfile
        run: npm install --package-lock-only --include=dev --ignore-scripts
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git commit -m "Generate dependency lockfile"
          git push origin HEAD:claude-major-rebuild
