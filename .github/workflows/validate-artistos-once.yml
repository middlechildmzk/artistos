name: Validate ArtistOS once

on:
  push:
    branches: [claude-major-rebuild]
    paths:
      - '.github/workflows/validate-artistos-once.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude-major-rebuild
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json
      - name: Install and validate
        run: |
          npm install --no-audit --no-fund
          npm run lint
          npm run typecheck
          npm test
          NEXT_PUBLIC_SUPABASE_URL=https://myrtdfyjoxvtubusrrmf.supabase.co NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_128ongB0ItsEwmef_F1zTg_YnxFX6M8 npm run build
      - name: Commit lockfile and remove one-time workflow
        run: |
          rm -f .github/workflows/validate-artistos-once.yml
          git config user.name "artistos-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json .github/workflows/validate-artistos-once.yml
          git commit -m "Validate ArtistOS and lock dependencies"
          git push origin HEAD:claude-major-rebuild
